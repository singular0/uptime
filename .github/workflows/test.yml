name: Tests

on:
  push:
    branches:
      - '**' # tag pushes run the tests through the Docker image workflow
  pull_request:
  workflow_call: # see docker.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # config/test.yaml connects to localhost without credentials
      mongo:
        # MongoDB 8.0+ refuses to start on Linux 6.19+ kernels, including the runners' (SERVER-121912)
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm test
